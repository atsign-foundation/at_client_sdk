name: at_contacts_group_flutter
description: A Flutter plugin project to provide group functionality with
  contacts using atPlatform.
version: 4.1.0
repository: https://github.com/atsign-foundation/at_client_sdk/tree/trunk/packages/at_contacts_group_flutter
homepage: https://atsign.com/
documentation: https://docs.atsign.com

environment:
  sdk: ^3.6.0
  flutter: ">=3.29.2"

dependencies:
  at_common_flutter: ^2.1.0
  at_commons: ^5.5.0
  at_client_mobile: ^3.3.0
  at_contact: ^3.0.9
  at_contacts_flutter: ^4.0.16
  at_utils: ^3.0.19
  collection: ^1.17.0
  emoji_picker_flutter: ^4.3.0
  file_picker: '>=10.0.0 <10.3.8'
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.0.4
  flutter_slidable: ^4.0.0
  flutter_toastr: ^1.0.3
  fluttertoast: ^8.2.2
  image_compression: ^1.0.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.atsign.at_contacts_group_flutter
        pluginClass: AtContactsGroupFlutterPlugin
      ios:
        pluginClass: AtContactsGroupFlutterPlugin
      macos:
        default_package: at_contacts_group_flutter
      windows:
        default_package: at_contacts_group_flutter
      linux:
        default_package: at_contacts_group_flutter

  # To add assets to your plugin package, add an assets section, like this:
  assets:
    - assets/images/empty_group.png
    - assets/images/send.png
    # - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
