name: at_client_examples
description: Examples of some of the most common usages of the at_client package.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.7.0"

dependencies:
  at_client: ^4.0.0
  at_client_cli: ^1.0.0
  at_commons: ^5.8.0
  at_utils: ^4.0.0-rc1
  args: ^2.5.0
  nocterm: ^0.6.0

# TODO(at_chops-4.0.0): restore the `at_chops: path: ../../at_chops` override
# below once at_client depends on at_chops 4 — 4.0.0-rc.1 removed RsaKeyPair
# and RsaSignatureAlgo, which at_client still uses. Until then this example builds against the
# published at_chops 3.x, which means it does NOT exercise local at_chops
# changes.
dependency_overrides:
  at_client:
    path: ../../at_client
  at_client_cli:
    path: ../../at_client_cli
  at_commons:
    path: ../../at_commons
  at_lookup:
    path: ../../at_lookup
  at_auth:
    path: ../../at_auth
  at_utils:
    path: ../../at_utils

dev_dependencies:
  lints: ^6.1.0
