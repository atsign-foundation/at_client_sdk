name: location_sharing
description: "Flutter location-sharing example: AtCollection<T> driving a live, end-to-end-encrypted share between atSigns."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  at_client: ^3.15.0-rc9
  at_client_flutter:
    path: ../../

dependency_overrides:
  at_client:
    path: ../../../at_client/
  at_auth:
    path: ../../../at_auth/
  at_lookup:
    path: ../../../at_lookup/
  at_commons:
    path: ../../../at_commons/
  at_chops:
    path: ../../../at_chops/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
