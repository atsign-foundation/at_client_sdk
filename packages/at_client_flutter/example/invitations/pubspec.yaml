name: invitations
description: "Flutter invitations example: the app for the invitations flow the at_client/example CLI programs prove end to end."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  at_client: ^3.15.0-rc2
  at_client_flutter:
    path: ../../
  at_utils: ^3.4.0
  app_links: ^6.4.0
  http: ^1.2.0
  path_provider: ^2.1.5
  play_install_referrer: ^0.5.0

dependency_overrides:
  at_client:
    path: ../../../at_client/
  at_auth:
    path: ../../../at_auth/
  at_lookup:
    path: ../../../at_lookup/
  at_commons:
    path: ../../../at_commons/
  at_chops:
    path: ../../../at_chops/

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
