name: invitations
description: "Flutter invitations example: the app for the invitations flow the at_client/example CLI programs prove end to end."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  at_client: ^3.15.0-rc7
  at_client_flutter:
    path: ../../
  at_utils: ^4.0.0-rc1
  app_links: ^6.4.0
  http: ^1.2.0
  path_provider: ^2.1.5
  play_install_referrer: ^0.5.0

# TODO(at_chops-4.0.0): restore the `at_chops: path: ../../../at_chops/` override
# below once at_client depends on at_chops 4 — 4.0.0-rc.1 removed classes
# at_client still uses, so the local path would not compile. Until then this example builds
# against the published at_chops 3.x and does NOT exercise local at_chops
# changes.
dependency_overrides:
  at_client:
    path: ../../../at_client/
  at_auth:
    path: ../../../at_auth/
  at_lookup:
    path: ../../../at_lookup/
  at_commons:
    path: ../../../at_commons/
  at_utils:
    path: ../../../at_utils/

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
