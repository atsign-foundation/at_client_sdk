name: at_client_flutter
description: A Flutter extension to the at_client library which adds support for mobile, desktop and IoT devices.
version: 1.1.0
repository: https://github.com/atsign-foundation/at_client_sdk/tree/trunk/packages/at_client_flutter
homepage: https://atsign.com
documentation: https://docs.atsign.com/

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^9.0.1
  biometric_storage: ^5.0.1
  collection: ^1.18.0
  at_commons: ^5.8.0
  at_utils: ^3.4.0
  at_chops: ^3.0.0
  at_lookup: ^3.5.0
  at_auth: ^3.0.1
  at_client: ^3.11.0
  encrypt: ^5.0.3
  phosphor_flutter: ^2.1.0
  intl: ^0.20.2
  file_picker: ^11.0.02
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  mocktail: ^1.0.4
  flutter_test:
    sdk: flutter
