name: at_policy_example
description: Simple at_policy usage examples
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.0.6

# TODO(at_chops-4.0.0): restore the `at_chops: path: ../../at_chops` override
# below once at_client depends on at_chops 4 — 4.0.0-rc.1 removed RsaKeyPair
# and RsaSignatureAlgo, which at_client still uses. Until then this example builds against the
# published at_chops 3.x, which means it does NOT exercise local at_chops
# changes.
dependency_overrides:
  at_policy:
    path: ..
  at_client_cli:
    path: ../../at_client_cli
  at_client:
    path: ../../at_client
  at_commons:
    path: ../../at_commons
  at_auth:
    path: ../../at_auth
  at_lookup:
    path: ../../at_lookup
  at_utils:
    path: ../../at_utils

dependencies:
  at_policy:
    path: ..
  at_client_cli: ^1.0.0
  at_client: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.9
