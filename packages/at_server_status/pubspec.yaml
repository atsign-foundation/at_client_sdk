name: at_server_status
description: A Dart library that provides a means to check on the status of the @‎root server as well as the secondary server for any particular @‎sign.
version: 2.0.0
repository: https://github.com/atsign-foundation/at_client_sdk/tree/trunk/packages/at_server_status
homepage: https://atsign.com
documentation: https://docs.atsign.com/

environment:
  sdk: ^3.6.0

# Detached from the pub workspace until at_lookup 4.0.0 and at_chops 4.0.0 are
# published: the rest of the repo keeps resolving hosted at_server_status 1.x,
# so it is unaffected by this break. Restore `resolution: workspace` and drop
# the overrides once both are on pub.dev.
dependency_overrides:
  at_lookup:
    path: ../at_lookup
  at_chops:
    path: ../at_chops

dependencies:
  at_lookup: ^4.0.0

dev_dependencies:
  uuid: ^4.0.0
  lints: ^6.0.0
  test: ^1.25.0
