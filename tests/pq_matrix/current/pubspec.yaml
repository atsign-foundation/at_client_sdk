name: pq_matrix_current
publish_to: none
description: >-
  The rollout matrix's stage-parameterised arm: this tree's at_client, driven
  through legacy / pqReady / pqActive.
version: 1.0.0

# Deliberately NOT a workspace member. It resolves the workspace packages by
# path through `dependency_overrides` instead, which reaches the shared
# scenario transitively — so one source file compiles against this tree here
# and against hosted 3.14.0 in the sibling `published/` package. See
# `docs/projects/pq/decisions.md` 96.

environment:
  sdk: ^3.6.0

dependencies:
  at_client: ^3.14.0
  at_auth: ^3.4.0-rc1
  at_chops: ^3.6.0
  pq_matrix_scenario:
    path: ../scenario

dependency_overrides:
  at_client:
    path: ../../../packages/at_client
  at_auth:
    path: ../../../packages/at_auth
  at_chops:
    path: ../../../packages/at_chops
  at_commons:
    path: ../../../packages/at_commons
  at_lookup:
    path: ../../../packages/at_lookup
  at_utils:
    path: ../../../packages/at_utils

dev_dependencies:
  lints: ^6.0.0
