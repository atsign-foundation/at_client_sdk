name: at_end2end_test
description: A starting point for Dart libraries or applications.
version: 1.0.0
homepage: https://www.atsign.com

publish_to: none

environment:
  sdk: '>=2.15.0 <4.0.0'

dependencies:
  at_demo_data: ^1.0.1
  at_auth: ^2.0.7
  at_client:
    path: ../../packages/at_client
  at_utils: ^3.2.0

dependency_overrides:
  at_lookup:
    git:
      url: https://github.com/atsign-foundation/at_libraries.git
      path: packages/at_lookup
      ref: websocket_uptake
      
dev_dependencies:
  test: ^1.25.8
  lints: ^2.0.0
  coverage: ^1.5.0
