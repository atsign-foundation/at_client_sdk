name: at_end2end_test
description: A starting point for Dart libraries or applications.
version: 1.0.0
homepage: https://www.atsign.com

publish_to: none

environment:
  sdk: '>=2.15.0 <4.0.0'

dependency_overrides:
  at_lookup:
    git:
      url: https://github.com/atsign-foundation/at_libraries
      ref: feat-better-activate-cli-feedback
      path: packages/at_lookup
  at_utils:
    git:
      url: https://github.com/atsign-foundation/at_libraries
      ref: feat-better-activate-cli-feedback
      path: packages/at_utils
  at_onboarding_cli:
    git:
      url: https://github.com/atsign-foundation/at_libraries
      ref: feat-better-activate-cli-feedback
      path: packages/at_onboarding_cli

dependencies:
  at_demo_data: ^1.0.1
  at_auth: ^2.0.7
  at_client:
    path: ../../packages/at_client

dev_dependencies:
  test: ^1.25.8
  lints: ^2.0.0
  coverage: ^1.5.0
