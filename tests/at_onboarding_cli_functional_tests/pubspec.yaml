name: at_onboarding_cli_functional_tests
description: functional tests for at_onboarding_cli.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=2.14.4 <4.0.0'

dependencies:
  at_lookup: ^3.0.49
  at_client: ^3.2.2
  at_commons: ^5.0.0
  at_demo_data: ^1.2.0

dependency_overrides:
  at_auth:
    git:
      url: https://github.com/atsign-foundation/at_libraries.git
      path: packages/at_auth
      ref: at_auth_faster_aes_changes
  at_onboarding_cli:
    path: ../../packages/at_onboarding_cli
  at_commons:
    path: ../../packages/at_commons
  at_chops:
    git:
      url: https://github.com/atsign-foundation/at_libraries.git
      path: packages/at_chops
      ref: at_chops_faster_aes
  at_cli_commons:
    path: ../../packages/at_cli_commons

dev_dependencies:
  lints: ^1.0.0
  test: ^1.17.2
  at_demo_data: ^1.0.3
