name: at_onboarding_cli_functional_tests
description: functional tests for at_onboarding_cli.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=2.14.4 <4.0.0'

dependencies:
  at_lookup: ^3.0.49
  at_client: ^3.4.0
  at_commons: ^5.3.0
  at_demo_data: ^1.2.0

dependency_overrides:
  at_client:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk
      ref: at-rpc-enable-same-atsign
      path: packages/at_client
  at_onboarding_cli:
    path: "../../packages/at_onboarding_cli"
  at_auth:
    path: "../../packages/at_auth"
  at_utils:
    path: "../../packages/at_utils"
  at_lookup:
    path: "../../packages/at_lookup"

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15
