name: at_functional_test
publish_to: none
description: Functional tests for the at_client_sdk packages
version: 1.0.0

environment:
  sdk: '>=2.15.0 <4.0.0'

dependency_overrides:
  at_lookup:
    git:
      url: https://github.com/atsign-foundation/at_libraries
      ref: feat-better-activate-cli-feedback
      path: packages/at_lookup
  at_utils:
    git:
      url: https://github.com/atsign-foundation/at_libraries
      ref: feat-better-activate-cli-feedback
      path: packages/at_utils
  at_onboarding_cli:
    git:
      url: https://github.com/atsign-foundation/at_libraries
      ref: feat-better-activate-cli-feedback
      path: packages/at_onboarding_cli

dependencies:
  uuid: 3.0.7
  at_demo_data: ^1.0.3
  at_client:
    path: ../../packages/at_client
  at_auth: ^2.0.7
  at_lookup: ^3.0.49

dev_dependencies:
  test: ^1.25.8
  lints: ^5.0.0
  coverage: ^1.5.0