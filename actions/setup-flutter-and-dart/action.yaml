name: Setup Flutter and Dart
description: |
  Installs flutter & dart, using a non-flutter dart binary of specified channel

inputs:
  flutter-channel:
    required: false
    description: Flutter channel to install
    default: "stable"
  dart-channel:
    required: false
    description: Dart channel to install
    default: stable

runs:
  using: composite
  steps:
    - name: Get latest Flutter stable commit
      shell: bash
      id: flutter-ref
      run: |
        sha=$(
        cat flutter_ref-${{ inputs.flutter-channel }}
        )
        if [ -z "$sha" ] || [ "$sha" == "null" ]; then
          echo "Error: Empty or null SHA found in flutter_ref-${{ inputs.flutter-channel }}"
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
      working-directory: ./actions/setup-flutter-and-dart/

    - name: Install Flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 #v2.12.0
      with:
        channel: ${{ inputs.flutter-channel }}
        cache: ${{ steps.flutter-ref.outputs.sha }}
        cache-key: ${{ steps.flutter-ref.outputs.sha }}

    # TEMPORARY: hardcoded to 3.13.0 (instead of ${{ inputs.dart-channel }}) to
    # prove the Dart 3.13 analyzer-compat fix in this branch on CI. Revert
    # before merge — some matrix jobs pass dart-channel: '' explicitly, which
    # overrides this composite action's own default, so pinning via the
    # input default wouldn't reach every job.
    - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
      with:
        sdk: "3.13.0"

    - name: Ensure dart on path is not from Flutter SDK
      shell: bash
      run: |
        if which dart | grep -q "flutter"; then
          exit 1
        fi
