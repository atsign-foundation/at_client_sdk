# This workflows runs when
# 1. pull_request raised to trunk branch.
# 2. tag created on at_tools repository
name: at_libraries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_contact
          - at_server_status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install dependencies in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Analyze project source in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart analyze

  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_auth
          - at_lookup
          - at_chops
          - at_onboarding_cli
          - at_commons
          - at_utils
          - at_cli_commons
          - at_policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install dependencies in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Analyze project source in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart analyze

      - name: run tests
        working-directory: packages/${{ matrix.package }}
        run: dart test --concurrency=1 --exclude-tags ffi

  build_and_test_ffi:
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: "3.5.0" # minimum version that OpenSSL supports MLKEM
      OPENSSL_INSTALL_DIR: ${{ github.workspace }}/.openssl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart

      - name: Cache OpenSSL build
        id: cache-openssl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OPENSSL_INSTALL_DIR }}
          key: openssl-${{ env.OPENSSL_VERSION }}-ubuntu-latest

      - name: Build OpenSSL ${{ env.OPENSSL_VERSION }} from source
        # Guard on the actual library file, not the cache-hit flag — a corrupt
        # or partial cache restore would otherwise skip the build and fail later.
        # Use --libdir=lib to force installation into lib/ regardless of whether
        # the host is 32 or 64-bit (otherwise OpenSSL 3.x defaults to lib64/).
        run: |
          LIBCRYPTO="${{ env.OPENSSL_INSTALL_DIR }}/lib/libcrypto.so.3"
          if [ -f "${LIBCRYPTO}" ]; then
            echo "libcrypto already present at ${LIBCRYPTO}, skipping build."
            exit 0
          fi
          echo "Building OpenSSL ${OPENSSL_VERSION}..."
          sudo apt-get update && sudo apt-get install -y build-essential
          curl -fsSL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            | tar xz -C /tmp
          cd "/tmp/openssl-${OPENSSL_VERSION}"
          ./Configure --prefix="${{ env.OPENSSL_INSTALL_DIR }}" \
            --openssldir="${{ env.OPENSSL_INSTALL_DIR }}/ssl" \
            --libdir=lib \
            shared no-tests
          make -j$(nproc)
          make install_sw

      - name: Verify OpenSSL build
        run: |
          # Resolve the real .so file (not a symlink) to avoid SONAME lookup
          # issues when Dart's DynamicLibrary.open follows the versioned symlink
          # and the dynamic linker resolves the SONAME against the system lib.
          LIBCRYPTO=$(realpath "${{ env.OPENSSL_INSTALL_DIR }}/lib/libcrypto.so.3")
          echo "Resolved libcrypto: ${LIBCRYPTO}"
          test -f "${LIBCRYPTO}" || (echo "ERROR: ${LIBCRYPTO} not found" && exit 1)
          strings "${LIBCRYPTO}" | grep -q "ML-DSA-65"  || (echo "ERROR: ML-DSA-65 not found in ${LIBCRYPTO}"  && exit 1)
          strings "${LIBCRYPTO}" | grep -q "ML-KEM-768" || (echo "ERROR: ML-KEM-768 not found in ${LIBCRYPTO}" && exit 1)
          echo "OK: ${LIBCRYPTO} exists and contains ML-DSA-65 and ML-KEM-768"
          # Export for the FFI test step — opening the real file bypasses SONAME resolution
          echo "LIBCRYPTO_REAL_PATH=${LIBCRYPTO}" >> "$GITHUB_ENV"

      - name: Install dependencies in at_chops
        working-directory: packages/at_chops
        run: dart pub get

      - name: Analyze project source in at_chops
        working-directory: packages/at_chops
        run: dart analyze

      - name: run tests with libcrypto available
        working-directory: packages/at_chops
        env:
          AT_CHOPS_LIBCRYPTO_PATH: ${{ env.LIBCRYPTO_REAL_PATH }}
          LD_LIBRARY_PATH: ${{ env.OPENSSL_INSTALL_DIR }}/lib
        # The ffi-tagged tests everywhere, plus all of at_pqc_test.dart —
        # its untagged tests select their backend by probing libcrypto, so
        # they exercise the FFI selection path only in this job (the
        # build_and_test matrix already runs the rest of the suite with
        # --exclude-tags ffi and no libcrypto).
        run: |
          dart test --concurrency=1 --tags ffi
          dart test --concurrency=1 test/at_pqc_test.dart

  # The dependency-tree walk's own unit tests, which every wasm_ratchet job below
  # depends on being correct. A green ratchet means nothing if the walk that
  # produced it is broken, so this runs as its own job rather than inside the
  # matrix.
  wasm_shakedown_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart

      - name: Install dependencies
        working-directory: tools/wasm_shakedown
        run: dart pub get

      - name: Analyze project source
        working-directory: tools/wasm_shakedown
        run: dart analyze

      - name: run tests
        working-directory: tools/wasm_shakedown
        run: dart test --concurrency=1

  # Keeps the neutral packages from silently getting worse.
  #
  # Why a dependency-tree walk and not a compile: `dart compile wasm` ACCEPTS
  # `dart:io`. It ships a stub that throws `Unsupported operation` on first use,
  # so a browser-hostile import compiles clean and fails in the browser instead
  # (measured on Dart 3.12). `dart compile js` accepts `dart:html` and `dart:js`
  # on top of that. No Dart web compiler gates `dart:io`, which is why the walk
  # is the primary gate here rather than a build step.
  #
  # Each package's test/wasm/dep_tree_test.dart pins the exact set of platform
  # libraries reachable from its barrels, and fails in BOTH directions: a new
  # entry is a regression, a missing entry means a blocker was fixed and the
  # baseline owes an update. Regenerate one with
  # `dart run wasm_shakedown:baseline <barrel>`.
  wasm_ratchet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # t2_required flips to true per package as its suite goes green under
          # WasmGC. Every entry starts false because the suites themselves import
          # dart:io, which has nothing to do with whether the library is neutral.
          # at_utils is the closest: 25 pass, and the 2 failures are real —
          # stdErrLoggingHandler throwing at runtime, exactly the failure mode
          # the structural gate cannot see. It goes green with the logging split.
          - package: at_utils
            t2_required: false
          - package: at_chops
            t2_required: false
            # The pure-Dart barrel only. The ffi-tagged tests need libcrypto and
            # are covered by build_and_test_ffi above.
            test_args: --exclude-tags ffi
          - package: at_lookup
            t2_required: false
          - package: at_client
            t2_required: false
            # Deliberately scoped, and stated rather than left to be discovered.
            # The runner compiles one wasm module PER TEST FILE, and at_client has
            # 68 of them — an unscoped run cannot finish inside any sane timeout.
            # These three are pure logic needing neither storage nor a socket,
            # which makes them the suites most likely to say something true about
            # WasmGC rather than about dart:io. Widen this list as the sweep
            # progresses; the target is every suite that needs neither.
            test_args: >-
              test/at_client_util_test.dart
              test/at_key_validation_test.dart
              test/default_response_parser_test.dart
          # Baseline only — at_auth is owned by the post-quantum program, and this
          # entry exists to notice a regression, not to drive a fix.
          - package: at_auth
            t2_required: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart

      - name: Install dependencies in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      # Resolves package: URIs through .dart_tool/package_config.json, so the
      # walk crosses package boundaries into the siblings and third-party
      # packages too — not just this package's own sources.
      - name: Dependency-tree ratchet in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart test --concurrency=1 test/wasm/dep_tree_test.dart

      # Executes the suites under WasmGC, which is what turns "compiles" into
      # "runs" — the structural gate above cannot see code that is neutral and
      # still wrong about integer width, string encoding or async ordering.
      #
      # Note the absent `--concurrency=1`. The other jobs in this file pass it,
      # but here the dominant cost is not test execution: the runner compiles a
      # separate wasm module for every test file, and serialising that is what
      # took at_chops past 25 minutes locally without finishing. Compilation
      # parallelises across cores; leave it to.
      #
      # Bounded rather than open-ended, because an unbounded allowed-to-fail step
      # is how a job quietly becomes the longest thing in CI.
      - name: Execute under Node + dart2wasm in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        continue-on-error: ${{ !matrix.t2_required }}
        timeout-minutes: 25
        run: dart test -p node -c dart2wasm ${{ matrix.test_args }}

  functional_tests_at_onboarding_cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_onboarding_cli_functional_tests
          - at_onboarding_cli_functional_tests_proxy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      #functional tests for at_onboarding_cli
      - name: add entry to hosts file
        run: echo "127.0.0.1    vip.ve.atsign.zone" | sudo tee -a /etc/hosts

      - name: Get functional test dependencies
        working-directory: tests/${{ matrix.package }}
        run: dart pub get

      - name: Start docker instance
        working-directory: tests/${{ matrix.package }}
        run: sudo docker compose up -d

      - name: Check for docker container readiness
        working-directory: tests/${{ matrix.package }}
        run: dart run check_docker_readiness.dart

      - name: Sleep for 10 seconds # to allow time for all atSigns to come up
        run: sleep 10s
        shell: bash

      # Note that, unlike the functional tests in at_client_sdk, we do not run the pkamLoad
      # job here, since we require all the atSigns to NOT be already onboarded.

      - name: run tests
        working-directory: tests/${{ matrix.package }}
        run: dart test --concurrency=1

      - name: kill docker image
        working-directory: tests/${{ matrix.package }}
        run: sudo docker compose down
