# This workflows runs when
# 1. pull_request raised to trunk branch.
# 2. tag created on at_tools repository
name: at_libraries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_contact
          - at_server_status
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install dependencies in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Analyze project source in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart analyze

  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_auth
          - at_lookup
          - at_chops
          - at_onboarding_cli
          - at_commons
          - at_utils
          - at_cli_commons
          - at_policy
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install dependencies in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Analyze project source in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart analyze

      - name: run tests
        working-directory: packages/${{ matrix.package }}
        run: dart test --concurrency=1 --exclude-tags ffi

  build_and_test_ffi:
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: "3.5.0" # minimum version that OpenSSL supports MLKEM
      OPENSSL_INSTALL_DIR: ${{ github.workspace }}/.openssl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./actions/setup-flutter-and-dart

      # checks GHA cache for pre-built OpenSSL install directory (
      - name: Cache OpenSSL build
        id: cache-openssl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.OPENSSL_INSTALL_DIR }}
          key: openssl-${{ env.OPENSSL_VERSION }}-ubuntu-latest

      - name: Restore shared-library permissions after cache restore
        if: steps.cache-openssl.outputs.cache-hit == 'true'
        run: |
          if [ -d "${{ env.OPENSSL_INSTALL_DIR }}/lib" ]; then
            chmod -R u+x "${{ env.OPENSSL_INSTALL_DIR }}/lib"
          fi

      - name: Build OpenSSL ${{ env.OPENSSL_VERSION }} from source
        if: steps.cache-openssl.outputs.cache-hit != 'true' # if the previos action was a cache miss
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          curl -fsSL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            | tar xz -C /tmp
          cd "/tmp/openssl-${OPENSSL_VERSION}"
          ./Configure --prefix="${OPENSSL_INSTALL_DIR}" --openssldir="${OPENSSL_INSTALL_DIR}/ssl" \
            shared no-tests
          make -j$(nproc)
          make install_sw

      - name: Verify OpenSSL build supports ML-KEM and ML-DSA
        run: |
          echo "Contents of ${{ env.OPENSSL_INSTALL_DIR }}/lib:"
          ls -la "${{ env.OPENSSL_INSTALL_DIR }}/lib/"
          LIB=$(ls "${{ env.OPENSSL_INSTALL_DIR }}/lib/libcrypto.so"* 2>/dev/null | grep -v '\.a$' | head -1)
          echo "Using: ${LIB}"
          test -f "${LIB}" || (echo "ERROR: no libcrypto.so* found" && exit 1)
          strings "${LIB}" | grep -q "ML-DSA-65" || \
            (echo "ERROR: ML-DSA-65 not found in libcrypto symbols" && exit 1)
          strings "${LIB}" | grep -q "ML-KEM-768" || \
            (echo "ERROR: ML-KEM-768 not found in libcrypto symbols" && exit 1)
          echo "OK: ML-DSA-65 and ML-KEM-768 symbols present in ${LIB}"

      - name: Install dependencies in at_chops
        working-directory: packages/at_chops
        run: dart pub get

      - name: Analyze project source in at_chops
        working-directory: packages/at_chops
        run: dart analyze

      - name: run FFI tests
        working-directory: packages/at_chops
        env:
          AT_CHOPS_LIBCRYPTO_PATH: ${{ env.OPENSSL_INSTALL_DIR }}/lib/libcrypto.so
          LD_LIBRARY_PATH: ${{ env.OPENSSL_INSTALL_DIR }}/lib
        run: dart test --concurrency=1 --tags ffi

  functional_tests_at_onboarding_cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_onboarding_cli_functional_tests
          - at_onboarding_cli_functional_tests_proxy

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      #functional tests for at_onboarding_cli
      - name: add entry to hosts file
        run: echo "127.0.0.1    vip.ve.atsign.zone" | sudo tee -a /etc/hosts

      - name: Get functional test dependencies
        working-directory: tests/${{ matrix.package }}
        run: dart pub get

      - name: Start docker instance
        working-directory: tests/${{ matrix.package }}
        run: sudo docker compose up -d

      - name: Check for docker container readiness
        working-directory: tests/${{ matrix.package }}
        run: dart run check_docker_readiness.dart

      - name: Sleep for 10 seconds # to allow time for all atSigns to come up
        run: sleep 10s
        shell: bash

      # Note that, unlike the functional tests in at_client_sdk, we do not run the pkamLoad
      # job here, since we require all the atSigns to NOT be already onboarded.

      - name: run tests
        working-directory: tests/${{ matrix.package }}
        run: dart test --concurrency=1

      - name: kill docker image
        working-directory: tests/${{ matrix.package }}
        run: sudo docker compose down
