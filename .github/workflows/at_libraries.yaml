# This workflows runs when
# 1. pull_request raised to trunk branch.
# 2. tag created on at_tools repository
name: at_libraries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_contact
          - at_server_status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install dependencies in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Analyze project source in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart analyze

  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_auth
          - at_lookup
          - at_chops
          - at_onboarding_cli
          - at_commons
          - at_utils
          - at_cli_commons
          - at_policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install dependencies in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Analyze project source in ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart analyze

      - name: run tests
        working-directory: packages/${{ matrix.package }}
        run: dart test --concurrency=1 --exclude-tags ffi --file-reporter json:acceptance-report.json

      # Feeds `packages/at_client/tool/acceptance_ledger.dart`, which joins these
      # against the catalogue's citations to say which acceptance rows a run
      # actually exercised. `if: always()` on purpose: a suite that FAILED is
      # exactly when knowing which rows lost their proof matters most.
      #
      # Emitted for EVERY package in the matrix rather than only the cited one.
      # Today only at_auth is cited from here (12 citations); conditioning on
      # that would mean a citation added to at_commons or at_chops later is
      # silently uncovered, and an uncovered row reads as missing coverage
      # rather than as missing wiring — the failure this whole ledger exists to
      # remove.
      #
      # ⚠️ The artifact name carries `matrix.package`, without which the eight
      # legs overwrite one another. That collision already happened once in
      # at_client_sdk.yaml across its stable/beta legs and cost a whole
      # dispatch to find.
      - name: Upload ${{ matrix.package }} acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-lib-${{ matrix.package }}
          path: packages/${{ matrix.package }}/acceptance-report.json
          if-no-files-found: warn

  build_and_test_ffi:
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: "3.5.0" # minimum version that OpenSSL supports MLKEM
      OPENSSL_INSTALL_DIR: ${{ github.workspace }}/.openssl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart

      - name: Cache OpenSSL build
        id: cache-openssl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OPENSSL_INSTALL_DIR }}
          key: openssl-${{ env.OPENSSL_VERSION }}-ubuntu-latest

      - name: Build OpenSSL ${{ env.OPENSSL_VERSION }} from source
        # Guard on the actual library file, not the cache-hit flag — a corrupt
        # or partial cache restore would otherwise skip the build and fail later.
        # Use --libdir=lib to force installation into lib/ regardless of whether
        # the host is 32 or 64-bit (otherwise OpenSSL 3.x defaults to lib64/).
        run: |
          LIBCRYPTO="${{ env.OPENSSL_INSTALL_DIR }}/lib/libcrypto.so.3"
          if [ -f "${LIBCRYPTO}" ]; then
            echo "libcrypto already present at ${LIBCRYPTO}, skipping build."
            exit 0
          fi
          echo "Building OpenSSL ${OPENSSL_VERSION}..."
          sudo apt-get update && sudo apt-get install -y build-essential
          curl -fsSL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            | tar xz -C /tmp
          cd "/tmp/openssl-${OPENSSL_VERSION}"
          ./Configure --prefix="${{ env.OPENSSL_INSTALL_DIR }}" \
            --openssldir="${{ env.OPENSSL_INSTALL_DIR }}/ssl" \
            --libdir=lib \
            shared no-tests
          make -j$(nproc)
          make install_sw

      - name: Verify OpenSSL build
        run: |
          # Resolve the real .so file (not a symlink) to avoid SONAME lookup
          # issues when Dart's DynamicLibrary.open follows the versioned symlink
          # and the dynamic linker resolves the SONAME against the system lib.
          LIBCRYPTO=$(realpath "${{ env.OPENSSL_INSTALL_DIR }}/lib/libcrypto.so.3")
          echo "Resolved libcrypto: ${LIBCRYPTO}"
          test -f "${LIBCRYPTO}" || (echo "ERROR: ${LIBCRYPTO} not found" && exit 1)
          strings "${LIBCRYPTO}" | grep -q "ML-DSA-65"  || (echo "ERROR: ML-DSA-65 not found in ${LIBCRYPTO}"  && exit 1)
          strings "${LIBCRYPTO}" | grep -q "ML-KEM-768" || (echo "ERROR: ML-KEM-768 not found in ${LIBCRYPTO}" && exit 1)
          echo "OK: ${LIBCRYPTO} exists and contains ML-DSA-65 and ML-KEM-768"
          # Export for the FFI test step — opening the real file bypasses SONAME resolution
          echo "LIBCRYPTO_REAL_PATH=${LIBCRYPTO}" >> "$GITHUB_ENV"

      - name: Install dependencies in at_chops
        working-directory: packages/at_chops
        run: dart pub get

      - name: Analyze project source in at_chops
        working-directory: packages/at_chops
        run: dart analyze

      - name: run tests with libcrypto available
        working-directory: packages/at_chops
        env:
          AT_CHOPS_LIBCRYPTO_PATH: ${{ env.LIBCRYPTO_REAL_PATH }}
          LD_LIBRARY_PATH: ${{ env.OPENSSL_INSTALL_DIR }}/lib
        # The ffi-tagged tests everywhere, plus all of at_pqc_test.dart —
        # its untagged tests select their backend by probing libcrypto, so
        # they exercise the FFI selection path only in this job (the
        # build_and_test matrix already runs the rest of the suite with
        # --exclude-tags ffi and no libcrypto).
        run: |
          dart test --concurrency=1 --tags ffi
          dart test --concurrency=1 test/at_pqc_test.dart

  # Two gates over at_chops, because neither covers the other.
  #
  # 1. The dependency-tree walk (test/wasm/dep_tree_test.dart) catches `dart:io`.
  #    A compile cannot: `dart compile wasm` ACCEPTS `dart:io` and ships a stub
  #    that throws `Unsupported operation` on first use, so a browser-hostile
  #    import compiles clean and fails in the browser instead (measured on Dart
  #    3.12). `dart compile js` accepts `dart:html` and `dart:js` on top. No Dart
  #    web compiler gates `dart:io`. The walk is one-way: a source outside the
  #    baseline fails, a source that gets fixed just stops being reported.
  #
  # 2. The compile probe (test/wasm/compile_probe.dart) catches the libraries
  #    dart2wasm rejects outright — dart:ffi, dart:html, dart:js, dart:mirrors —
  #    and is the measurable for whether at_chops compiles to wasm at all.
  #
  # at_chops only, deliberately. It is the one core package already web-safe, so
  # it is the only one where a gate holds a line rather than recording a backlog.
  # The other four get theirs as each is ported.
  #
  # There is deliberately no `dart test -p node -c dart2wasm` step. Executing the
  # suites under WasmGC is what would turn "compiles" into "runs", but on this
  # runner every suite fails to load before any test body executes: the generated
  # CJS bootstrap calls `instantiate` from the ESM `.mjs` init file and gets
  # `undefined`. The same command runs fine on Dart 3.12 + Node 24 locally, and
  # neither version is pinned here — Dart comes from `dart-channel: stable` and
  # Node from the runner image. An allowed-to-fail step that fails every time
  # cannot be told apart from one reporting real failures, so it waits for a
  # pinned pair where a failure means something.
  wasm_ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart

      # The walk's own tests run in the same job as the gate they underwrite: a
      # green ratchet means nothing if the walk that produced it is broken.
      - name: Install dependencies in wasm_shakedown
        working-directory: tools/wasm_shakedown
        run: dart pub get

      - name: Analyze wasm_shakedown
        working-directory: tools/wasm_shakedown
        run: dart analyze

      - name: Test wasm_shakedown
        working-directory: tools/wasm_shakedown
        run: dart test --concurrency=1

      - name: Install dependencies in at_chops
        working-directory: packages/at_chops
        run: dart pub get

      # Resolves package: URIs through .dart_tool/package_config.json, so the walk
      # crosses package boundaries into the siblings and third-party packages too —
      # not just at_chops' own sources.
      - name: Dependency-tree ratchet in at_chops
        working-directory: packages/at_chops
        run: dart test --concurrency=1 test/wasm/dep_tree_test.dart

      # A hard gate, not allowed-to-fail: at_chops compiles today. Tree-shaking
      # means this proves the front end accepts the graph, not that the code is
      # correct under WasmGC.
      - name: Compile at_chops to wasm
        working-directory: packages/at_chops
        run: dart compile wasm test/wasm/compile_probe.dart -o "$RUNNER_TEMP/at_chops.wasm"

  functional_tests_at_onboarding_cli:
    runs-on: ubuntu-latest
    env:
      # The TRUNK-TRACKING atServer build. at_onboarding_cli_functional_tests
      # activates an atSign with a post-quantum keypair, which needs an
      # atServer that verifies ML-DSA PKAM — that lands on trunk well before
      # it is released, so the published `vip` cannot run it. The proxy leg
      # does not need it, but runs the same build so the two legs are never
      # testing against different servers.
      VIRTUALENV_IMAGE: atsigncompany/virtualenv:dev_env
    strategy:
      fail-fast: false
      matrix:
        package:
          - at_onboarding_cli_functional_tests
          - at_onboarding_cli_functional_tests_proxy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      #functional tests for at_onboarding_cli
      - name: add entry to hosts file
        run: echo "127.0.0.1    vip.ve.atsign.zone" | sudo tee -a /etc/hosts

      - name: Get functional test dependencies
        working-directory: tests/${{ matrix.package }}
        run: dart pub get

      # No sudo, and that is the whole point: sudo resets the environment, so
      # VIRTUALENV_IMAGE above never reached compose and it silently fell back
      # to the published `vip` in docker-compose.yaml. The runner user is in
      # the docker group, so plain compose works - it is what every container
      # job in at_client_sdk.yaml does.
      - name: Start docker instance
        working-directory: tests/${{ matrix.package }}
        run: docker compose up -d

      # A wrong image does not announce itself: the atServer simply fails to
      # verify an ML-DSA PKAM signature and the test reports a server-side
      # `AT0010 RangeError`, which reads as a client bug. Assert what is
      # actually running rather than what the YAML asked for.
      - name: Confirm the virtualenv image that is actually running
        working-directory: tests/${{ matrix.package }}
        run: |
          # Every container in the project, not one named service: the two
          # packages call the service different things (`virtualenv` and
          # `at_virtualenv`), and the proxy package runs a second container
          # besides. Asking whether ANY of them is the wanted image is the
          # question that holds for both.
          want="$VIRTUALENV_IMAGE"
          found=0
          for cid in $(docker compose ps -q); do
            got=$(docker inspect --format '{{.Config.Image}}' "$cid")
            echo "  running: $got"
            if [ "$got" = "$want" ]; then found=1; fi
          done
          if [ "$found" != "1" ]; then
            echo "No container is running $want - compose did not receive"
            echo "VIRTUALENV_IMAGE and fell back to its default."
            exit 1
          fi
          echo "confirmed: $want is running"

      - name: Check for docker container readiness
        working-directory: tests/${{ matrix.package }}
        run: dart run check_docker_readiness.dart

      - name: Sleep for 10 seconds # to allow time for all atSigns to come up
        run: sleep 10s
        shell: bash

      # Note that, unlike the functional tests in at_client_sdk, we do not run the pkamLoad
      # job here, since we require all the atSigns to NOT be already onboarded.

      - name: run tests
        working-directory: tests/${{ matrix.package }}
        run: dart test --concurrency=1

      - name: kill docker image
        working-directory: tests/${{ matrix.package }}
        run: docker compose down
