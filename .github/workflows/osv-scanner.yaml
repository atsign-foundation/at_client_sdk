# This workflows runs when
# 1. pull_request raised to trunk branch.
# 2. tag created on at_tools repository
name: osv-scanner

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  scan-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install workspace dependencies
        run: dart pub get

      # Temporary, until at_chops is added to the workspace
      - name: Install at_chops dependencies (temp)
        run: dart pub get
        working-directory: packages/at_chops

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@90b209d0ea55cea1da9fc0c4e65782cc6acb6e2e # v2.2.2
        with:
          scan-args: |-
            --lockfile=./pubspec.lock
            --lockfile=./packages/at_chops/pubspec.lock
