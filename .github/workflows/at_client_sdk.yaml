# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: at_client_sdk

on:
  workflow_dispatch:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  unit_at_client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart-channel: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      # Install dependencies in at_client library
      - name: Install dependencies in at_client
        working-directory: packages/at_client
        run: dart pub get

      # Run analyzer in at_client library
      - name: Analyze project source in at_client
        working-directory: packages/at_client
        run: dart analyze

      # Check formatting
      - name: Check that code in packages is correctly formatted
        working-directory: packages/at_client
        run: dart format . -o none --set-exit-if-changed

      # Run unit tests
      - name: Run at_client unit tests, with code coverage measurement
        working-directory: packages/at_client
        run: dart test --concurrency=1 --coverage="coverage"

      - name: Convert at_client coverage to LCOV format
        working-directory: packages/at_client
        run: dart run coverage:format_coverage --check-ignore --lcov --in=coverage --out=unit_test_coverage.lcov --report-on=lib

      #      Commenting out for now
      #      - name: Upload at_client coverage to Codecov
      #        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
      #        with:
      #          file: packages/at_client/unit_test_coverage.lcov
      #          flags: at_client_unit_tests

  unit_at_client_flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart-channel: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      # Install dependencies of at_client_flutter
      - name: Installing dependencies
        working-directory: packages/at_client_flutter
        run: flutter pub get --no-example

      # Analyze at_client_flutter package
      - name: flutter analyze
        working-directory: packages/at_client_flutter
        run: flutter analyze --no-fatal-infos

      # Check formatting
      - name: Check that code in packages is correctly formatted
        working-directory: packages/at_client_flutter
        run: dart format . -o none --set-exit-if-changed

      # Run unit tests
      - name: Run at_client_flutter unit tests, with code coverage measurement
        working-directory: packages/at_client_flutter
        run: flutter test --concurrency=1 --coverage

      - name: Convert at_client_flutter coverage to LCOV format
        working-directory: packages/at_client_flutter
        run: dart run coverage:format_coverage --lcov --check-ignore --in=coverage --out=unit_test_coverage.lcov --report-on=lib

      #      Commenting out for now
      #      - name: Upload at_client_flutter coverage to Codecov
      #        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
      #        with:
      #          file: packages/at_client_flutter/unit_test_coverage.lcov
      #          flags: at_client_flutter_unit_tests

  functional_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart-channel: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      # Install dependencies in at_functional_test
      - name: Install dependencies in at_functional_test
        working-directory: tests/at_functional_test
        run: dart pub get

      - name: Add entry to hosts file
        run: echo "127.0.0.1    vip.ve.atsign.zone" | sudo tee -a /etc/hosts

      # Start docker container to run functional tests
      - name: Start docker instance
        working-directory: tests/at_functional_test/test
        run: docker compose pull && docker compose up -d

      - name: Check for docker container readiness
        working-directory: tests/at_functional_test
        run: dart run test/check_docker_readiness.dart

      - name: Run PKAM
        run: docker exec test-virtualenv-1 supervisorctl start pkamLoad

      - name: Check test environment readiness
        working-directory: tests/at_functional_test
        run: dart run test/check_test_env.dart

      # Run functional tests
      - name: Run functional tests
        working-directory: tests/at_functional_test
        run: dart test --concurrency=1 --coverage="coverage"

      - name: Convert coverage to LCOV format
        working-directory: tests/at_functional_test
        run: dart run coverage:format_coverage --check-ignore --lcov --in=coverage --out=functional_test_coverage.lcov --report-on=../../packages/at_client/lib

      #      Commenting out for now
      #      - name: Upload coverage to Codecov
      #        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
      #        with:
      #          file: tests/at_functional_test/functional_test_coverage.lcov
      #          flags: functional_tests

      # stop docker containers
      - name: stop docker containers
        working-directory: tests/at_functional_test/test
        run: docker compose down

  end2end_tests_prep:
    # Don't run on PRs from a fork as the secrets aren't available
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest

    steps:
      - name: update image on cicd VMs
        # Needs a secret, so don't run for Dependabot PRs
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "cicd1.atsign.wtf,cicd2.atsign.wtf"
          username: ubuntu
          key: ${{ secrets.CICD_SSH_KEY }}
          script: |
            scriptURL="https://raw.githubusercontent.com/atsign-foundation/at_client_sdk/trunk/tools/${HOSTNAME}/update_ce2e_images.sh"
            echo "$scriptURL"
            wget -q -O update_ce2e_images.sh "$scriptURL"
            ./update_ce2e_images.sh

  # The Job runs end-to-end tests between two atSign's running on server trunk branch
  #
  # @ce2e1..@ce2e4 are LONG-LIVED atServers, so this job must never write
  # post-quantum material to them: a signing root is immutable and create-once,
  # and a published namespace key or a retrofitted enrollment outlives the run
  # that made it. tests/at_end2end_test/dart_test.yaml allowlists the files a
  # bare `dart test` runs, and the PQ ones under test/pq/ are not on it. The
  # pqe2e_tests job runs those against a container it starts and throws away.
  end2end_tests:
    needs: [end2end_tests_prep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install dependencies in at_client
        working-directory: packages/at_client
        run: dart pub get

      # Install dependencies in at_end2end_test
      - name: Install dependencies in at_end2end_test
        working-directory: tests/at_end2end_test
        run: dart pub get

      # Populate at_credentials.dart from CICD_DATA_DART secret
      - name: Get CICD keys into place
        # Needs a secret, so don't run for Dependabot PRs
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: echo "${{secrets.AT_CICD_CREDENTIALS}}" > tests/at_end2end_test/lib/src/at_credentials.dart

      # Move the config file in-place
      - name: Config for @cicd2/3
        run: mv tests/at_end2end_test/config/config23.yaml tests/at_end2end_test/config/config.yaml

      # Run end-to-end test
      - name: End to end test
        # Needs a secret, so don't run for Dependabot PRs
        if: ${{ github.actor != 'dependabot[bot]' }}
        working-directory: tests/at_end2end_test
        run: dart test --concurrency=1 --coverage="coverage"

      - name: Convert coverage to LCOV format
        # Needs tests to have run, so don't run for Dependabot PRs
        if: ${{ github.actor != 'dependabot[bot]' }}
        working-directory: tests/at_end2end_test
        run: dart run coverage:format_coverage --check-ignore --lcov --in=coverage --out=end2end_test_coverage.lcov --report-on=lib

  #      Commenting out for now
  #      - name: Upload coverage to Codecov
  #        # Needs LCOV report to upload, so don't run for Dependabot PRs
  #        if: ${{ github.actor != 'dependabot[bot]' }}
  #        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
  #        with:
  #          file: tests/at_end2end_test/end2end_test_coverage.lcov
  #          flags: end2end_tests

  # The Job runs end-to-end tests between server code running on trunk branch and canary (production ready) server
  #
  # Same allowlist as end2end_tests: @ce2e1..@ce2e4 are long-lived, so the
  # post-quantum files under tests/at_end2end_test/test/pq/ are not on the
  # `paths:` list in dart_test.yaml and a bare `dart test` cannot reach them.
  end2end_test_14:
    needs: [end2end_tests_prep]
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/setup-flutter-and-dart
        with:
          dart-channel: ${{ matrix.dart-channel}}

      - name: Install dependencies in at_client
        working-directory: packages/at_client
        run: dart pub get

      # Install dependencies in at_end2end_test
      - name: Install dependencies in at_end2end_test
        working-directory: tests/at_end2end_test
        run: dart pub get

      # Populate at_credentials.dart from CICD_DATA_DART secret
      - name: Get CICD keys into place
        # Needs a secret, so don't run for Dependabot PRs
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: echo "${{secrets.AT_CICD_CREDENTIALS}}" > tests/at_end2end_test/lib/src/at_credentials.dart

      # Move the config file in-place
      - name: Config for @cicd1/4
        run: mv tests/at_end2end_test/config/config14.yaml tests/at_end2end_test/config/config.yaml

      - name: Submit and approve enrollment request
        working-directory: tests/at_end2end_test
        run: dart run test/enrollment_setup.dart

      # Run end-to-end test
      - name: End to end test
        # Needs a secret, so don't run for Dependabot PRs
        if: ${{ github.actor != 'dependabot[bot]' }}
        working-directory: tests/at_end2end_test
        run: dart test --concurrency=1

      # Makes all the enrollment requests inactive. The pending enrollment request are set to denied state and
      # the approved enrollment requests are set to revoked state.
      - name: Enrollment setup teardown
        # Even if the tests fail in the above step, we need to clean up the enrollments.
        # Therefore, we set this to "!cancelled()" to ensure this step runs regardless of the outcome of the previous step.
        if: ${{ !cancelled() }}
        working-directory: tests/at_end2end_test
        run: dart run test/enrollment_teardown.dart

  # The post-quantum half of the end-to-end suite, against a virtualenv
  # container this job starts and throws away.
  #
  # It exists because these tests write records that cannot be taken back: a
  # signing root is immutable and create-once, a published namespace key, an
  # `_apsk` and a retrofitted enrollment all outlive the run. On the long-lived
  # @ce2e atSigns that would be permanent, so end2end_tests / end2end_test_14
  # exclude them via the allowlist in tests/at_end2end_test/dart_test.yaml and
  # this job names test/pq/ explicitly.
  #
  # REQUIRES an atServer image that verifies ML-DSA PKAM signatures. If the
  # published virtualenv image does not yet, this job fails at authentication
  # with a server-side
  #   AT0010-Exception: RangeError (length): Invalid value: Not in inclusive
  #   range 0..47: 48
  # out of AtLookupImpl.pkamAuthenticate — the atServer choking on an ML-DSA
  # public key. That signature means the image, not the client.
  #
  # The sequence below mirrors tests/at_end2end_test/runLocal.sh, including the
  # per-atSign grace-hours step and its ordering constraint.
  pqe2e_tests:
    runs-on: ubuntu-latest
    env:
      # The e2e virtualenv runs in base-port mode so it never collides with the
      # functional suite's fixed 64/25000-25999 range. Both the container and
      # the Dart processes read this: check_local_env.dart and local_setup.dart
      # fall back to root port 64 when it is unset, which would point them at
      # an atDirectory that is not there.
      VIRTUALENV_BASE_PORT: 26000
      VE_TOP_PORT: 26099
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `with:` — this job has no matrix, so the action's own stable
      # defaults apply rather than an expression that can only be empty.
      - uses: ./actions/setup-flutter-and-dart

      - name: Install dependencies in at_client
        working-directory: packages/at_client
        run: dart pub get

      - name: Install dependencies in at_end2end_test
        working-directory: tests/at_end2end_test
        run: dart pub get

      - name: Add entry to hosts file
        run: echo "127.0.0.1    vip.ve.atsign.zone" | sudo tee -a /etc/hosts

      # No VIRTUALENV_IMAGE set, so docker-compose.yaml takes its default:
      # the published atsigncompany/virtualenv:vip.
      - name: Start docker instance
        working-directory: tests/at_end2end_test/test
        run: docker compose pull && docker compose up -d

      - name: Wait for supervisor
        run: |
          for i in $(seq 1 30); do
            docker exec e2e_virtualenv supervisorctl status >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec e2e_virtualenv supervisorctl status

      # One atSign gets a zero-hour self-enrollment grace so the retirement row
      # can watch a capped legacy enrollment actually age out instead of waiting
      # 30 days. Per-secondary rather than the container-wide
      # apkamSelfEnrollmentGraceHours env var, which every secondary would
      # inherit: at grace 0 a retrofit kills its parent within a millisecond,
      # and the clone rows need a parent that survives its sibling's retrofit.
      # Each secondary's `config` is a symlink to one shared directory, so
      # replacing the symlink with a private copy is what makes the setting
      # local to this atSign. The env var must stay unset for the yaml to be
      # read at all (env beats yaml in AtSecondaryConfig).
      #
      # BEFORE pkamLoad, deliberately. Restarting a secondary mid-load severs
      # whatever key install was in flight against it and nothing retries — the
      # atSign would come up with no public key and every test on it would fail
      # at authentication, a long way from this step.
      - name: Set apkamSelfEnrollmentGraceHours=0 for @eve🛠
        run: |
          docker exec e2e_virtualenv sh -c "
            set -e
            d='/atsign/secondary/eve🛠'
            rm -f \"\$d/config\"
            mkdir -p \"\$d/config\"
            cp /atsign/secondary/base/config/config.yaml \"\$d/config/config.yaml\"
            printf '\nenrollment:\n  apkamSelfEnrollmentGraceHours: 0\n' >> \"\$d/config/config.yaml\"
          "
          docker exec e2e_virtualenv supervisorctl restart '25010_@eve🛠'

      - name: Run PKAM
        run: |
          for i in $(seq 1 30); do
            docker exec e2e_virtualenv supervisorctl start pkamLoad >/dev/null 2>&1 && break
            sleep 2
          done

      # Probes the reconfigured atSign as well as the first one, so a load that
      # missed it fails here rather than inside a test's setUpAll.
      - name: Check test environment readiness
        working-directory: tests/at_end2end_test
        run: dart run test/check_local_env.dart

      # Mints atKeys/ and writes config/config.yaml for the demo atSigns in the
      # virtualenv. Both are gitignored; this job needs no CICD secret, so it
      # also runs on forks.
      - name: Generate atKeys and config
        working-directory: tests/at_end2end_test
        run: dart run test/local_setup.dart

      # The explicit path overrides the allowlist in dart_test.yaml, which is
      # what confines a bare `dart test` to the non-PQ files.
      # -x legacy-server: UC-B0.1 asserts a PQ client REFUSES to upgrade
      # against a legacy atServer, so it needs a PINNED pre-PQ image rather
      # than the current one. Against this job's image it would not fail
      # usefully — it would stop testing anything. The legacy_server_tests job
      # runs it.
      - name: Run post-quantum end-to-end tests
        working-directory: tests/at_end2end_test
        run: dart test --concurrency=1 test/pq -x legacy-server

      - name: Stop docker containers
        if: ${{ !cancelled() }}
        working-directory: tests/at_end2end_test/test
        run: docker compose down

  # UC-B0.1 — a PQ-capable client must REFUSE to upgrade against a legacy
  # atServer, abort cleanly, stay legacy, and leave no partial state.
  #
  # It gets its own job because it is the one row that wants an OLD atServer.
  # Every other post-quantum test wants the newest one. Run against a current
  # image this row does not fail — it stops testing anything, because the
  # server simply auto-approves and there is no refusal to observe. So the
  # image is pinned to a release tag, which stays pre-PQ for good.
  #
  # Verified in both directions when it was written: green against the pin, red
  # against a PQ-capable image.
  legacy_server_tests:
    runs-on: ubuntu-latest
    env:
      # The e2e virtualenv runs in base-port mode so it never collides with the
      # functional suite's fixed 64/25000-25999 range. Both the container and
      # the Dart processes read this: check_local_env.dart and local_setup.dart
      # fall back to root port 64 when it is unset, which would point them at
      # an atDirectory that is not there.
      VIRTUALENV_BASE_PORT: 26000
      VE_TOP_PORT: 26099
      # A RELEASE-PINNED pre-PQ atServer. `vip` gains post-quantum support
      # and stops being a legacy server; this tag does not, which is the
      # only reason the row it runs keeps meaning something.
      VIRTUALENV_IMAGE: atsigncompany/virtualenv:vip-p3.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `with:` — this job has no matrix, so the action's own stable
      # defaults apply rather than an expression that can only be empty.
      - uses: ./actions/setup-flutter-and-dart

      - name: Install dependencies in at_client
        working-directory: packages/at_client
        run: dart pub get

      - name: Install dependencies in at_end2end_test
        working-directory: tests/at_end2end_test
        run: dart pub get

      - name: Add entry to hosts file
        run: echo "127.0.0.1    vip.ve.atsign.zone" | sudo tee -a /etc/hosts

      # VIRTUALENV_IMAGE above pins the pre-PQ release; docker-compose.yaml
      # reads it.
      - name: Start docker instance
        working-directory: tests/at_end2end_test/test
        run: docker compose pull && docker compose up -d

      - name: Wait for supervisor
        run: |
          for i in $(seq 1 30); do
            docker exec e2e_virtualenv supervisorctl status >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec e2e_virtualenv supervisorctl status

      # One atSign gets a zero-hour self-enrollment grace so the retirement row
      # can watch a capped legacy enrollment actually age out instead of waiting
      # 30 days. Per-secondary rather than the container-wide
      # apkamSelfEnrollmentGraceHours env var, which every secondary would
      # inherit: at grace 0 a retrofit kills its parent within a millisecond,
      # and the clone rows need a parent that survives its sibling's retrofit.
      # Each secondary's `config` is a symlink to one shared directory, so
      # replacing the symlink with a private copy is what makes the setting
      # local to this atSign. The env var must stay unset for the yaml to be
      # read at all (env beats yaml in AtSecondaryConfig).
      #
      # BEFORE pkamLoad, deliberately. Restarting a secondary mid-load severs
      # whatever key install was in flight against it and nothing retries — the
      # atSign would come up with no public key and every test on it would fail
      # at authentication, a long way from this step.
      - name: Set apkamSelfEnrollmentGraceHours=0 for @eve🛠
        run: |
          docker exec e2e_virtualenv sh -c "
            set -e
            d='/atsign/secondary/eve🛠'
            rm -f \"\$d/config\"
            mkdir -p \"\$d/config\"
            cp /atsign/secondary/base/config/config.yaml \"\$d/config/config.yaml\"
            printf '\nenrollment:\n  apkamSelfEnrollmentGraceHours: 0\n' >> \"\$d/config/config.yaml\"
          "
          docker exec e2e_virtualenv supervisorctl restart '25010_@eve🛠'

      - name: Run PKAM
        run: |
          for i in $(seq 1 30); do
            docker exec e2e_virtualenv supervisorctl start pkamLoad >/dev/null 2>&1 && break
            sleep 2
          done

      # Probes the reconfigured atSign as well as the first one, so a load that
      # missed it fails here rather than inside a test's setUpAll.
      - name: Check test environment readiness
        working-directory: tests/at_end2end_test
        run: dart run test/check_local_env.dart

      # Mints atKeys/ and writes config/config.yaml for the demo atSigns in the
      # virtualenv. Both are gitignored; this job needs no CICD secret, so it
      # also runs on forks.
      - name: Generate atKeys and config
        working-directory: tests/at_end2end_test
        run: dart run test/local_setup.dart

      # The explicit path overrides the allowlist in dart_test.yaml, which is
      # what confines a bare `dart test` to the non-PQ files.
      - name: Run the legacy-atServer refusal row
        working-directory: tests/at_end2end_test
        run: dart test --concurrency=1 test/pq -t legacy-server

      - name: Stop docker containers
        if: ${{ !cancelled() }}
        working-directory: tests/at_end2end_test/test
        run: docker compose down
