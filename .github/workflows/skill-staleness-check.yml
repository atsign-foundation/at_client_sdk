name: Skill staleness check

# Runs when a PR changes public API files in at_client, at_client_flutter, or at_auth.
# Fails unless the skill was also updated in the same PR, or the developer adds
# the 'skill-ok' label to confirm the change doesn't affect the skill.

on:
  pull_request:
    branches:
      - trunk
    paths:
      - 'packages/at_client/lib/src/collections/**'
      - 'packages/at_client/lib/at_client.dart'
      - 'packages/at_client_flutter/lib/**'
      - 'packages/at_auth/lib/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  check-skill-updated:
    name: Skill up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check skill was updated or bypassed
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Count files changed in .agents/skills/ in this PR
          SKILL_CHANGED=$(git diff --name-only origin/trunk...HEAD | grep -c '\.agents/skills/' || true)

          # Allow bypass via 'skill-ok' label
          if echo "$PR_LABELS" | grep -q 'skill-ok'; then
            echo "✓ skill-ok label present — bypass confirmed"
            exit 0
          fi

          if [[ "$SKILL_CHANGED" -eq 0 ]]; then
            echo ""
            echo "❌ Public API files changed but .agents/skills/ was not updated."
            echo ""
            echo "Options:"
            echo "  1. Update the skill:  .agents/skills/atsign-dart-sdk/"
            echo "     Then bump metadata.version in .agents/skills/atsign-dart-sdk/SKILL.md"
            echo "     and add an entry to .agents/skills/atsign-dart-sdk/CHANGELOG.md"
            echo ""
            echo "  2. Add the 'skill-ok' label to this PR if the change does not"
            echo "     affect documented API behaviour (e.g. refactor, test, internal fix)."
            exit 1
          fi

          echo "✓ Skill updated alongside the API change"
