# Which packages are gated for WASM. Run with `dart run wasm_shakedown`.
#
# Adding a package is one stanza — nothing in the package, nothing in CI. Gate a
# package only once it is web-safe, so a gate holds a line rather than recording
# a backlog: at_client owns 7 offenders today, which is why it is not here yet.
# at_utils and at_lookup joined below as each was ported.
#
# `ratchets` walk the import graph, `probe` compiles, `controls` keep the walk
# honest. Baselines are one-way. See tools/wasm_shakedown/README.md for why.

at_chops:
  # NOT resolvable from the workspace. at_chops 4.0.0 is detached from the root
  # `workspace:` list until at_client migrates off the 3.x facade, so
  # `package:at_chops/...` resolves out of the pub cache there and a plain run
  # would walk the PUBLISHED 3.x. Run this gate against the package's own
  # `dart pub get`, which is what the `wasm_ratchet` job does:
  #
  #   dart pub get -C packages/at_chops
  #   dart run wasm_shakedown -c .github/wasm_gates.yaml \
  #     --resolve-from at_chops=packages/at_chops
  #
  # Without the flag the baselines below fail rather than pass — 3.x owns 2
  # blocked packages and puts the bindings at a different path — so forgetting
  # it is red, not a false green. Drop this note when at_chops rejoins
  # `workspace:`.

  # Web-safe first: every OpenSSL and FFI algorithm lives behind
  # at_chops_ffi.dart, so at_chops.dart is pure Dart.
  #
  # `cryptography` is absent from the blocked count because under web
  # resolution its configurable imports select the pure-Dart implementation,
  # not the dart:html Web Crypto path. Structural only — not evidence it
  # computes the right answers under WasmGC.
  ratchets:
    - barrel: package:at_chops/at_chops.dart
      allowed_offenders: []
      # Nothing under this barrel reaches a blocked package. It was 2 —
      # at_utils + chalkdart, via the logger — which 3.x reached through
      # at_chops_impl.dart alone; 4.0.0 removes that facade and imports no
      # logger anywhere in lib/.
      max_blocked_packages: 0
      # The walk is 433 files. Smaller than 3.x's 583 because 4.0.0 drops six
      # dependencies onto pointycastle; the floor sits under it with room for
      # a dependency to shed a file without turning the gate red.
      min_files_walked: 380
  probe:
    # at_chops_ffi.dart is absent on purpose: it is the FFI island and does not
    # compile to wasm. The control below asserts it still holds what it isolates.
    - package:at_chops/at_chops.dart
    - package:at_chops/types.dart
  controls:
    - barrel: package:at_chops/at_chops_ffi.dart
      reaches_file: lib/src/ffi/openssl_ffi_bindings.dart
      reaches_library: dart:ffi
      because: the FFI algorithms it exists to quarantine

at_auth:
  # Gated since the 4.0.0 barrel split (#2179). at_auth.dart holds key material,
  # the stores' interfaces and the auth flows; anything needing a filesystem, a
  # raw socket or the dart:io HTTP stack moved to at_auth_io.dart.
  #
  # One inherited blocked package, not at_auth's own code: chalkdart. at_utils
  # came off with the 4.0.0 barrel split, which cleaned at_utils.dart and
  # at_logger.dart -- but not at_progress.dart, which still exports
  # src/logging/progress.dart and its chalkdart import. That barrel is how
  # chalkdart is still reachable here: at_auth.dart and several of the files
  # behind it import it. Porting at_progress.dart takes chalkdart off. at_lookup
  # came off with its 4.0.0 transport split.
  #
  # at_auth builds no connection of its own - its atServer check asks over the
  # lookup it is handed - so nothing it reaches imports at_lookup_io.dart or
  # at_server_status.
  ratchets:
    - barrel: package:at_auth/at_auth.dart
      allowed_offenders: []
      max_blocked_packages: 1
      min_files_walked: 850
  probe:
    - package:at_auth/at_auth.dart
  controls:
    - barrel: package:at_auth/at_auth_io.dart
      reaches_file: lib/src/keys/io/file_io.dart
      because: the filesystem code it exists to quarantine

at_utils:
  # Gated by the 4.0.0 barrel split. at_utils.dart holds AtSignLogger, AtUtils and
  # atmetadata; PseudoServerSocket, ApplicationConfiguration and the file/stderr/CLI
  # logging handlers (all dart:io, plus chalkdart for CLI coloring) moved to
  # at_utils_io.dart.
  ratchets:
    - barrel: package:at_utils/at_utils.dart
      allowed_offenders: []
      max_blocked_packages: 0
      min_files_walked: 90
    # at_progress.dart still reaches chalkdart through src/logging/progress.dart.
    # Baselined at 1 so the one-way ceiling can only tighten to 0.
    - barrel: package:at_utils/at_progress.dart
      allowed_offenders: []
      max_blocked_packages: 1
      min_files_walked: 10
  probe:
    - package:at_utils/at_utils.dart
  controls:
    - barrel: package:at_utils/at_utils_io.dart
      reaches_file: lib/src/networking/pseudo_server_socket.dart
      reaches_library: dart:io
      because: the native code it exists to quarantine

at_lookup:
  # Gated by the 4.0.0 transport split. at_lookup.dart holds AtLookUp, the
  # AtConnection/AtTransport byte-channel seam and the address-finder interface;
  # the TLS socket, the atDirectory lookup and the SecureSocketTransport that
  # implements the seam moved to at_lookup_io.dart. at_lookup_web.dart holds
  # the WebSocket transport.
  #
  # Zero blocked packages on the first run. The neutral barrel reaches at_chops,
  # at_commons, at_utils, meta and mutex, and the first two splits had already
  # done the work: at_chops.dart and at_utils.dart are the neutral barrels of
  # their own 4.0.0 majors, which is what keeps chalkdart off this graph.
  # at_lookup stays in at_auth's blocked set above regardless -- at_auth imports
  # at_lookup_io.dart at two sites.
  ratchets:
    - barrel: package:at_lookup/at_lookup.dart
      allowed_offenders: []
      max_blocked_packages: 0
      min_files_walked: 570
    - barrel: package:at_lookup/at_lookup_web.dart
      allowed_offenders: []
      max_blocked_packages: 0
      min_files_walked: 800
  probe:
    # at_lookup_io.dart is absent on purpose. dart compile wasm accepts dart:io
    # and stubs it, so probing the io barrel would pass and prove nothing; the
    # ratchet is what holds that line. The controls below assert the io barrel
    # still holds what it isolates.
    - package:at_lookup/at_lookup.dart
    - package:at_lookup/at_lookup_web.dart
  controls:
    - barrel: package:at_lookup/at_lookup_io.dart
      reaches_file: lib/src/io/secure_socket_util.dart
      reaches_library: dart:io
      because: the TLS socket construction it exists to quarantine

    # A second island, not a duplicate of the first: the address path and the
    # transport path are quarantined for different reasons, and one control on
    # the socket util stays green with the finder gutted.
    - barrel: package:at_lookup/at_lookup_io.dart
      reaches_file: lib/src/io/cacheable_secondary_address_finder.dart
      because: the raw-TLS atDirectory lookup, which has no browser equivalent
